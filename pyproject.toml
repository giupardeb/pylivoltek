[tool.poetry]
name = "pylivoltek"
version = "0.1.0"
description = "Python API Client for the Livoltek API"
authors = ["giupardeb"]
readme = "README.md"
packages = [
    { include = "pylivoltek" },
]
include = [
  { path = "pylivoltek/**/*", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = "^3.13"
certifi = "^14.05.14"
six="^1.10"
python_dateutil="^2.5.3"
urllib3="^2.6.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
